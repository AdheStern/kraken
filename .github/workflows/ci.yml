# .github/workflows/ci.yml
# Integración continua de cada rama, PR y main (AGENTS.md §10 CI/CD): Biome, tipos, dominio, integración con
# Postgres (Testcontainers), build y E2E. Corre en el runner de ops-01 cuando exista (variable CI_RUNNER).
# REGLA: una rama feat/ o fix/ entra a main (fast-forward) solo con este CI en verde (§9 Git).

name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Biome, tipos y tests
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      # POR QUÉ: postinstall corre prisma generate, que lee prisma.config.ts y exige la URL de migraciones aunque
      # no se conecte (igual que en el Dockerfile). Testcontainers da su propia base a los tests de integración.
      - run: pnpm install --frozen-lockfile
        env:
          MIGRATION_DATABASE_URL: postgresql://build@localhost/build
      # REGLA: un aviso alto en dependencias de runtime frena la integración; los aceptados están en
      # pnpm-workspace.yaml (auditConfig.ignoreGhsas) con su motivo (ISO 27001 A.8.8).
      - run: pnpm audit --prod --audit-level high
      - run: pnpm biome ci
      # POR QUÉ: PageProps, LayoutProps y RouteContext los genera Next en .next/types; sin build previo hay que
      # generarlos antes de tsc (next-env.d.ts y .next no se versionan).
      - run: pnpm typecheck
      - run: pnpm test
      # Testcontainers levanta su propio Postgres; necesita Docker en el runner.
      - run: pnpm test:int

  e2e:
    name: E2E sobre el build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: dima
          POSTGRES_PASSWORD: dima
          POSTGRES_DB: dima_hub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dima -d dima_hub"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://dima:dima@localhost:5432/dima_hub
      MIGRATION_DATABASE_URL: postgresql://dima:dima@localhost:5432/dima_hub
      BETTER_AUTH_SECRET: ci-solo-pruebas-no-es-un-secreto-real-0123456789
      BETTER_AUTH_URL: http://localhost:3100
      DEV_SEED_PASSWORD: ci-demo-password-123
      SUPERADMIN_EMAIL: admin@dima.local
      SUPERADMIN_PASSWORD: ci-admin-password-123
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      - run: pnpm db:seed:dev
      - run: pnpm db:seed:admin
      - run: pnpm build
      # TRAMPA: --with-deps usa apt, y los espejos de Ubuntu del runner a veces no resuelven (falla de DNS de la
      # infraestructura, 2026-11-11). La imagen ya trae las librerías de Chromium; lo que falta son fuentes opcionales
      # (CJK, cirílico) que las pruebas no usan. Si apt falla o tarda más de 5 min, se instala solo el navegador.
      - name: Navegador de Playwright
        run: |
          if ! timeout 300 pnpm exec playwright install --with-deps chromium; then
            echo "::warning::No se pudieron instalar las dependencias de sistema de Playwright; se instala solo Chromium."
            pnpm exec playwright install chromium
          fi
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
