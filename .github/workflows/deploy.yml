# .github/workflows/deploy.yml
# Entrega (AGENTS.md §10 CI/CD): cuando CI pasa en main, imágenes app y worker en GHCR con el sha del commit →
# staging (migraciones + nodo) → aprobación manual del entorno "production" → producción nodo por nodo.
# Los despliegues corren en el runner autoalojado de ops-01: es el único que llega a la red interna.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  imagenes:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        run: echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Imagen app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kraken-app:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Imagen worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kraken-worker:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: imagenes
    runs-on: [self-hosted, ops-01]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/scripts/deploy.sh staging ${{ needs.imagenes.outputs.tag }}

  produccion:
    needs: [imagenes, staging]
    runs-on: [self-hosted, ops-01]
    # REGLA: el entorno "production" exige aprobación manual en GitHub (AGENTS.md §10).
    environment: production
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/scripts/deploy.sh production ${{ needs.imagenes.outputs.tag }}
