# .github/workflows/deploy.yml
# Entrega (AGENTS.md §10 CI/CD): cuando CI pasa en main, imágenes app y worker en GHCR con el sha del commit →
# staging (migraciones + nodo) → aprobación manual del entorno "production" → producción nodo por nodo.
# Los despliegues corren en el runner autoalojado de ops-01: es el único que llega a la red interna.
# LIMITACIÓN: mientras ops-01 no exista solo se dispara a mano; al tenerlo, volver a agregar el disparo
# workflow_run (workflows: [CI], types: [completed], branches: [main]) (AGENTS.md §10).

name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  imagenes:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        # TRAMPA: GHCR exige minúsculas y el dueño es AdheStern; los compose bajan de ghcr.io/adhestern.
        run: |
          echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Imagen app
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: app
          push: true
          tags: ${{ steps.tag.outputs.registry }}/kraken-app:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Imagen worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: worker
          push: true
          tags: ${{ steps.tag.outputs.registry }}/kraken-worker:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  staging:
    needs: imagenes
    runs-on: [self-hosted, ops-01]
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash deploy/scripts/deploy.sh staging ${{ needs.imagenes.outputs.tag }}

  produccion:
    needs: [imagenes, staging]
    runs-on: [self-hosted, ops-01]
    # REGLA: el entorno "production" exige aprobación manual en GitHub (AGENTS.md §10).
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash deploy/scripts/deploy.sh production ${{ needs.imagenes.outputs.tag }}
