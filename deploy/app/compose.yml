# deploy/app/compose.yml
# Nodo de aplicación de producción (lpzvmkrkapp01, luego lpzvmkrkapp02; AGENTS.md §3 y §10): Next.js, worker
# pg-boss y HAProxy (TLS y la base por :5000). keepalived (IP virtual 172.22.12.206) corre en el sistema operativo:
# necesita la red del host y privilegios (ver keepalived.conf). Alloy (logs a Loki) va en el perfil "logs" hasta
# que Loki tenga destino. Secretos en /etc/kraken/*.env (dueño root:deploy, permisos 640: docker compose los lee
# como deploy; fuera del repositorio); certificado en /etc/kraken/tls/kraken.pem (root, 600). Imágenes en GHCR por
# commit: deploy.sh copia a /opt/kraken/ compose.yml, haproxy.cfg y alloy.river y escribe KRAKEN_TAG en
# /opt/kraken/.env (junto a NODE_IP y, si cambia, KRAKEN_REGISTRY).
#   docker compose -f /opt/kraken/compose.yml up -d
#   docker compose -f /opt/kraken/compose.yml --profile migrate run --rm migrate

name: kraken

x-image: &image-defaults
  restart: unless-stopped
  env_file: /etc/kraken/app.env
  extra_hosts:
    # POR QUÉ: la app llega a Postgres por el HAProxy de BD del propio nodo (host:5000), nunca directo.
    - "host.docker.internal:host-gateway"
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  app:
    <<: *image-defaults
    image: ${KRAKEN_REGISTRY:-ghcr.io/aclaure-dima}/kraken-app:${KRAKEN_TAG:?define KRAKEN_TAG}
    ports:
      # Solo en la IP del nodo en 172.22.12.0/24 (NODE_IP en /opt/kraken/.env): la usan los HAProxy de los nodos.
      - "${NODE_IP:?define NODE_IP}:3000:3000"
    # POR QUÉ: los adjuntos van a SharePoint por Graph (ADR-16, variables SHAREPOINT_* del env_file); sin montaje.

  worker:
    <<: *image-defaults
    image: ${KRAKEN_REGISTRY:-ghcr.io/aclaure-dima}/kraken-worker:${KRAKEN_TAG:?define KRAKEN_TAG}
    stop_grace_period: 30s

  migrate:
    <<: *image-defaults
    image: ${KRAKEN_REGISTRY:-ghcr.io/aclaure-dima}/kraken-worker:${KRAKEN_TAG:?define KRAKEN_TAG}
    restart: "no"
    profiles: [migrate]
    # REGLA: solo este servicio recibe la clave del dueño del esquema (DDL). La app y el worker corren con
    # kraken_app (solo DML): un fallo en la app no puede desactivar triggers ni borrar tablas (AGENTS.md §4).
    env_file: [/etc/kraken/app.env, /etc/kraken/migrate.env]
    command: ["pnpm", "migrate:deploy"]

  haproxy:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    network_mode: host
    # TRAMPA: con la red del host, el usuario de la imagen (uid 99) no puede abrir puertos < 1024; arranca como
    # root, abre los puertos y lee el certificado, y baja a haproxy (user/group en global de haproxy.cfg).
    user: root
    env_file: /etc/kraken/haproxy.env
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      # Socket de administración: el despliegue drena y habilita nodos por aquí.
      - /run/haproxy:/run/haproxy
      # PEM con el certificado del dominio, su cadena y la clave (permisos 600, dueño root).
      - /etc/kraken/tls/kraken.pem:/etc/kraken/tls/kraken.pem:ro

  # Envía los logs JSON de app y worker (con requestId) a Loki. LIMITACIÓN: Loki aún no tiene destino; arranca solo
  # con --profile logs, después de poner su URL en alloy.river.
  alloy:
    image: grafana/alloy:v1.9.1
    restart: unless-stopped
    profiles: [logs]
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy.river:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
