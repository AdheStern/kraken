# deploy/app/haproxy.cfg
# HAProxy de cada nodo de aplicación (AGENTS.md §3, §10):
#   web   :80   → los dos Next.js; saca un nodo si /api/health/ready falla y pone X-Request-ID.
#   pg    :5000 → el primario de Patroni (su API :8008/primary responde 200 solo en el primario).
#   stats :8404 → panel y /metrics para Prometheus (solo VLAN de operación).
# Variables (de /etc/kraken/haproxy.env): APP_01_IP, APP_02_IP, DB_01_IP, DB_02_IP, DB_03_IP.
# TLS lo termina el FortiGate/Radware antes de la IP virtual.

global
  log stdout format raw local0 info
  user haproxy
  group haproxy
  maxconn 4000
  stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
  log global
  timeout connect 5s
  timeout client 60s
  timeout server 60s

frontend web
  mode http
  bind :80
  option httplog
  option forwardfor
  # REGLA: el requestId une el log del borde con los JSON de la app (src/server/request-log.ts).
  unique-id-format %{+X}o\ %ci%cp%fi%fp%Ts%rt%pid
  # TRAMPA: siempre se reescribe; si se conservara el del cliente, podría falsear el rastro de la auditoría.
  http-request set-header X-Request-ID %[unique-id]
  log-format "%ci [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %{+Q}r id=%ID"
  default_backend app

backend app
  mode http
  balance roundrobin
  option httpchk GET /api/health/ready
  http-check expect status 200
  default-server inter 5s fall 3 rise 2
  server app-01 "${APP_01_IP}":3000 check
  server app-02 "${APP_02_IP}":3000 check

frontend pg
  mode tcp
  bind :5000
  default_backend pg_primary

backend pg_primary
  mode tcp
  option httpchk GET /primary
  http-check expect status 200
  # POR QUÉ: si el primario cambia, se cortan las conexiones al viejo para que la app reconecte al nuevo.
  default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
  server db-01 "${DB_01_IP}":5432 maxconn 100 check port 8008
  server db-02 "${DB_02_IP}":5432 maxconn 100 check port 8008
  server db-03 "${DB_03_IP}":5432 maxconn 100 check port 8008

frontend stats
  mode http
  # REGLA: solo en la IP de operación del nodo (la que raspa Prometheus en ops-01), nunca en todas.
  bind "${STATS_BIND_IP}":8404
  http-request use-service prometheus-exporter if { path /metrics }
  stats enable
  stats uri /
  stats refresh 10s
