# deploy/app/haproxy.cfg
# HAProxy de cada nodo de aplicación (AGENTS.md §3, §10), en la red del host:
#   web   :443 → los Next.js de los nodos (TLS con /etc/kraken/tls/kraken.pem); saca un nodo si
#                /api/health/ready falla y pone X-Request-ID. :80 solo redirige a https.
#   pg    :5000 → el primario de Patroni (su API :8008/primary responde 200 solo en el primario).
#   stats :8404 → panel y /metrics para Prometheus en STATS_BIND_IP (de /etc/kraken/haproxy.env) y en 127.0.0.1
#                 para el chequeo de keepalived.
# REGLA: los nombres de los servidores de `backend app` son los de deploy/hosts/production; deploy.sh los drena
# por nombre (set server app/<nombre> state drain).

global
  log stdout format raw local0 info
  user haproxy
  group haproxy
  maxconn 4000
  stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
  ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
  log global
  timeout connect 5s
  timeout client 60s
  timeout server 60s

frontend http
  mode http
  bind :80
  http-request redirect scheme https code 301

frontend web
  mode http
  bind :443 ssl crt /etc/kraken/tls/kraken.pem alpn h2,http/1.1
  option httplog
  option forwardfor
  # POR QUÉ: Next y Better Auth arman URLs y cookies seguras según el esquema que vio el cliente.
  http-request set-header X-Forwarded-Proto https
  # REGLA: el requestId une el log del borde con los JSON de la app (src/server/request-log.ts).
  unique-id-format %{+X}o\ %ci%cp%fi%fp%Ts%rt%pid
  # TRAMPA: siempre se reescribe; si se conservara el del cliente, podría falsear el rastro de la auditoría.
  http-request set-header X-Request-ID %[unique-id]
  log-format "%ci [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %{+Q}r id=%ID"
  default_backend app

backend app
  mode http
  balance roundrobin
  option httpchk GET /api/health/ready
  http-check expect status 200
  default-server inter 5s fall 3 rise 2
  server lpzvmkrkapp01 172.22.12.112:3000 check
  # Al crear lpzvmkrkapp02: descomentar con su IP real, en el haproxy.cfg de AMBOS nodos, y descomentarlo también
  # en deploy/hosts/production.
  # server lpzvmkrkapp02 <IP_APP02>:3000 check

frontend pg
  mode tcp
  bind :5000
  default_backend pg_primary

backend pg_primary
  mode tcp
  option httpchk GET /primary
  http-check expect status 200
  # POR QUÉ: si el primario cambia, se cortan las conexiones al viejo para que la app reconecte al nuevo.
  default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
  server lpzvmkrkdb01 172.22.12.114:5432 maxconn 100 check port 8008
  # Al sumar la réplica al clúster "kraken": descomentar con su IP real en el haproxy.cfg de cada nodo de app.
  # server lpzvmkrkdb02 <IP_DB02>:5432 maxconn 100 check port 8008

frontend stats
  mode http
  # REGLA: solo en la IP de operación del nodo (la que raspa Prometheus en ops-01) y en localhost (keepalived),
  # nunca en todas.
  bind "${STATS_BIND_IP}":8404
  bind 127.0.0.1:8404
  http-request use-service prometheus-exporter if { path /metrics }
  stats enable
  stats uri /
  stats refresh 10s
