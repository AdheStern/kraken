# deploy/app/keepalived.conf
# IP virtual 172.22.12.206 de los nodos de aplicación (AGENTS.md §3): el FortiGate publica el 443 hacia esta IP y
# el HAProxy del nodo que la tenga termina TLS. Se instala en el sistema operativo (apt install keepalived) en
# /etc/keepalived/keepalived.conf, con el usuario del chequeo creado antes:
#   sudo useradd --system --no-create-home --shell /usr/sbin/nologin keepalived_script
# Este archivo es el de lpzvmkrkapp01. En lpzvmkrkapp02 cambian tres valores: priority 100, unicast_src_ip con su IP
# y unicast_peer con 172.22.12.112.
# Reemplazar <IP_LPZVMKRKAPP02> por la IP reservada para ese nodo aunque aún no exista: los anuncios van unicast a
# una dirección sin nadie y lpzvmkrkapp01 pasa de BACKUP a MASTER y toma la IP virtual a los ~4 s.
# TRAMPA: no dejar unicast_peer vacío: sin peers keepalived vuelve a multicast (comprobado con keepalived 2.3.1).

global_defs {
  enable_script_security
  # POR QUÉ: el chequeo solo hace un curl a 127.0.0.1; no necesita root.
  script_user keepalived_script
}

# POR QUÉ: la IP virtual se va al otro nodo si el HAProxy de este deja de responder, no solo si cae la VM.
# REGLA: HAProxy escucha stats en 127.0.0.1:8404 justamente para este chequeo (frontend stats de haproxy.cfg).
vrrp_script chk_haproxy {
  script "/usr/bin/curl -fsS -o /dev/null http://127.0.0.1:8404/"
  interval 2
  fall 3
  rise 2
}

vrrp_instance KRAKEN_VIP {
  # POR QUÉ: los dos nodos arrancan en BACKUP con nopreempt; el que tiene la IP la conserva aunque vuelva el de
  # mayor prioridad, para no cortar conexiones dos veces por una sola falla. La prioridad decide solo la elección.
  state BACKUP
  nopreempt
  interface ens33
  # REGLA: el mismo virtual_router_id en ambos nodos; 206 por el último octeto de la IP virtual, sin chocar con otros
  # VRRP de la red 172.22.12.0/24.
  virtual_router_id 206
  priority 110
  advert_int 1
  # POR QUÉ: anuncios unicast entre los nodos; sin multicast, que la red de VMware puede filtrar.
  unicast_src_ip 172.22.12.112
  unicast_peer {
    <IP_LPZVMKRKAPP02>
  }
  # POR QUÉ: sin authentication: auth_type PASS viaja en claro y no protege nada; VRRPv3 la eliminó (RFC 5798).
  virtual_ipaddress {
    172.22.12.206/24 dev ens33
  }
  # TRAMPA: activar recién con HAProxy corriendo en este nodo (después del primer despliegue). Con el chequeo
  # fallando, keepalived pone la instancia en FAULT y suelta la IP virtual: con un solo nodo, nadie la toma.
  # Para activarlo: descomentar y `sudo systemctl reload keepalived`; verificar con `ip -br addr show ens33`.
  # track_script {
  #   chk_haproxy
  # }
}
