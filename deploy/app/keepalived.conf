# deploy/app/keepalived.conf
# IP virtual 172.22.12.206 de los nodos de aplicación (AGENTS.md §3): el FortiGate publica el 443 hacia esta IP y
# el HAProxy del nodo que la tenga termina TLS. Se instala en el sistema operativo (apt install keepalived) en
# /etc/keepalived/keepalived.conf.
# lpzvmkrkapp01: state MASTER, priority 110. lpzvmkrkapp02 (cuando exista): state BACKUP, priority 100.
# Reemplazar: <INTERFAZ> (la de 172.22.12.0/24, `ip -br addr`) y <CLAVE_VRRP> (8 caracteres, la misma en ambos).
# Mientras haya un solo nodo, el bloque unicast_peer queda comentado: la IP virtual vive en lpzvmkrkapp01 y solo
# se suelta si su HAProxy deja de responder.

global_defs {
  enable_script_security
  script_user root
}

# POR QUÉ: la IP virtual se va al otro nodo si el HAProxy de este deja de responder, no solo si cae la VM.
# REGLA: HAProxy escucha stats en 127.0.0.1:8404 justamente para este chequeo (frontend stats de haproxy.cfg).
vrrp_script chk_haproxy {
  script "/usr/bin/curl -fsS -o /dev/null http://127.0.0.1:8404/"
  interval 2
  fall 3
  rise 2
}

vrrp_instance KRAKEN_VIP {
  state MASTER
  interface <INTERFAZ>
  virtual_router_id 51
  priority 110
  advert_int 1
  # Al crear lpzvmkrkapp02: descomentar con la IP del OTRO nodo (en app01, la de app02; en app02, 172.22.12.112).
  # unicast_peer {
  #   <IP_DEL_OTRO_NODO>
  # }
  authentication {
    auth_type PASS
    auth_pass <CLAVE_VRRP>
  }
  virtual_ipaddress {
    172.22.12.206/24
  }
  track_script {
    chk_haproxy
  }
}
