# deploy/app/keepalived.conf
# IP virtual compartida por app-01 y app-02 (AGENTS.md §3): el FortiGate/Radware publica el 443 hacia esta IP.
# Se instala en el sistema operativo (apt install keepalived) en /etc/keepalived/keepalived.conf.
# En app-01: state MASTER, priority 110. En app-02: state BACKUP, priority 100.
# Reemplazar: <INTERFAZ>, <IP_VIRTUAL>/<MASCARA>, <IP_DEL_OTRO_NODO>, <CLAVE_VRRP> (8 caracteres).

global_defs {
  enable_script_security
  script_user root
}

# POR QUÉ: la IP virtual se va al otro nodo si el HAProxy de este deja de responder, no solo si cae la VM.
vrrp_script chk_haproxy {
  script "/usr/bin/curl -fsS -o /dev/null http://127.0.0.1:8404/"
  interval 2
  fall 3
  rise 2
}

vrrp_instance KRAKEN_VIP {
  state MASTER
  interface <INTERFAZ>
  virtual_router_id 51
  priority 110
  advert_int 1
  unicast_peer {
    <IP_DEL_OTRO_NODO>
  }
  authentication {
    auth_type PASS
    auth_pass <CLAVE_VRRP>
  }
  virtual_ipaddress {
    <IP_VIRTUAL>/<MASCARA>
  }
  track_script {
    chk_haproxy
  }
}
