# deploy/backup/pgbackrest.db.conf
# pgBackRest en cada nodo de base de datos (db-01..03): empuja el WAL a ops-01 por TLS (archive_command de
# Patroni) y deja que ops-01 tome los respaldos por su servidor TLS. Se copia a /etc/kraken/pgbackrest.conf.
# Reemplazar <NODO> (db-01 | db-02 | db-03) e <IP_OPS_01>.

[global]
repo1-host=<IP_OPS_01>
repo1-host-type=tls
repo1-host-ca-file=/etc/pgbackrest/tls/ca.crt
repo1-host-cert-file=/etc/pgbackrest/tls/<NODO>.crt
repo1-host-key-file=/etc/pgbackrest/tls/<NODO>.key

# POR QUÉ: con archive-async el primario no espera a la red para cerrar cada segmento de WAL.
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=warn
log-level-file=info

tls-server-address=*
tls-server-ca-file=/etc/pgbackrest/tls/ca.crt
tls-server-cert-file=/etc/pgbackrest/tls/<NODO>.crt
tls-server-key-file=/etc/pgbackrest/tls/<NODO>.key
tls-server-auth=ops-01=kraken

[kraken]
pg1-path=/var/lib/postgresql/data/pgdata
