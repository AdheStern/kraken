# deploy/backup/pgbackrest.repo.conf
# pgBackRest en ops-01, el host de repositorio (AGENTS.md §10 Respaldos): recibe el WAL continuo y toma los
# respaldos de los tres nodos por TLS. Dos repositorios:
#   repo1 → NAS (montado en /mnt/nas/pgbackrest): 8 semanas de completos, 14 días de diferenciales.
#   repo2 → Azure Blob con inmutabilidad (WORM): 12 meses. Credencial sin permiso de borrado.
# Se copia a /etc/pgbackrest/pgbackrest.conf (permisos 640, dueño pgbackrest). Reemplazar <…>.

[global]
repo1-path=/mnt/nas/pgbackrest
repo1-retention-full=8
repo1-retention-diff=14
# REGLA: respaldos cifrados con una clave que no vive en el NAS (§10).
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=<CLAVE_CIFRADO_REPO1>

repo2-type=azure
repo2-azure-account=<CUENTA_STORAGE>
repo2-azure-container=pgbackrest
repo2-azure-key-type=sas
repo2-azure-key=<SAS_ESCRITURA_SIN_BORRADO>
repo2-path=/kraken
repo2-retention-full-type=time
repo2-retention-full=365
repo2-cipher-type=aes-256-cbc
repo2-cipher-pass=<CLAVE_CIFRADO_REPO2>

archive-async=y
spool-path=/var/spool/pgbackrest
process-max=4
compress-type=zst
log-level-console=info
log-level-file=detail
start-fast=y

# Servidor TLS: los nodos de base de datos empujan el WAL aquí.
tls-server-address=*
tls-server-ca-file=/etc/pgbackrest/tls/ca.crt
tls-server-cert-file=/etc/pgbackrest/tls/ops-01.crt
tls-server-key-file=/etc/pgbackrest/tls/ops-01.key
tls-server-auth=db-01=kraken
tls-server-auth=db-02=kraken
tls-server-auth=db-03=kraken

[kraken]
pg1-host=<IP_DB_01>
pg1-host-type=tls
pg1-host-ca-file=/etc/pgbackrest/tls/ca.crt
pg1-host-cert-file=/etc/pgbackrest/tls/ops-01.crt
pg1-host-key-file=/etc/pgbackrest/tls/ops-01.key
pg1-path=/var/lib/postgresql/data/pgdata
pg2-host=<IP_DB_02>
pg2-host-type=tls
pg2-host-ca-file=/etc/pgbackrest/tls/ca.crt
pg2-host-cert-file=/etc/pgbackrest/tls/ops-01.crt
pg2-host-key-file=/etc/pgbackrest/tls/ops-01.key
pg2-path=/var/lib/postgresql/data/pgdata
pg3-host=<IP_DB_03>
pg3-host-type=tls
pg3-host-ca-file=/etc/pgbackrest/tls/ca.crt
pg3-host-cert-file=/etc/pgbackrest/tls/ops-01.crt
pg3-host-key-file=/etc/pgbackrest/tls/ops-01.key
pg3-path=/var/lib/postgresql/data/pgdata
# POR QUÉ: el respaldo se toma de una réplica para no cargar al primario.
backup-standby=y
