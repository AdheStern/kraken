# deploy/backup/pgbackrest.restore.conf
# pgBackRest de solo lectura en stg-01 (restauración de prueba mensual, AGENTS.md §10): lee los dos repositorios
# sin tocar los nodos de producción. Se copia a /etc/pgbackrest/pgbackrest.conf (640, dueño postgres).
# Mismas claves de cifrado que pgbackrest.repo.conf; SAS propia de solo lectura (permisos r y l).

[global]
# NAS montado en solo lectura en stg-01.
repo1-path=/mnt/nas/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=<CLAVE_CIFRADO_REPO1>

repo2-type=azure
repo2-azure-account=<CUENTA_STORAGE>
repo2-azure-container=pgbackrest
repo2-azure-key-type=sas
repo2-azure-key=<SAS_SOLO_LECTURA>
repo2-path=/kraken
repo2-cipher-type=aes-256-cbc
repo2-cipher-pass=<CLAVE_CIFRADO_REPO2>

process-max=4
log-level-console=info
log-level-file=off

[kraken]
pg1-path=/var/lib/kraken/restore-test/pgdata
