# deploy/compose.dev.yml
# Entorno de desarrollo: PostgreSQL 18 y correo falso (Mailpit). Ver AGENTS.md §0 Comandos.
name: dima-hub-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dima
      POSTGRES_PASSWORD: dima
      POSTGRES_DB: dima_hub
    ports:
      - "5432:5432"
    volumes:
      # TRAMPA: desde la 18 la imagen guarda los datos en /var/lib/postgresql/18/docker y rechaza un volumen en
      # .../data. Volumen nuevo: el de la 16 (pgdata) queda intacto y no se mezclan versiones.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dima -d dima_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata18:
