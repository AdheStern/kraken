# deploy/compose.dev.yml
# Entorno de desarrollo: PostgreSQL 16 y correo falso (Mailpit). Ver AGENTS.md §0 Comandos.
name: dima-hub-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dima
      POSTGRES_PASSWORD: dima
      POSTGRES_DB: dima_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dima -d dima_hub"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
