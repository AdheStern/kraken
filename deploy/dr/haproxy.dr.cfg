# deploy/dr/haproxy.dr.cfg
# HAProxy de la VM de recuperación (AGENTS.md §10 DR): termina TLS (no hay FortiGate delante), un solo Next.js y
# la base local. El :5000 conserva el DATABASE_URL de producción (host.docker.internal:5000) sin tocar app.env.

global
  log stdout format raw local0 info
  user haproxy
  group haproxy
  maxconn 2000
  stats socket /run/haproxy/admin.sock mode 660 level admin

defaults
  log global
  timeout connect 5s
  timeout client 60s
  timeout server 60s

frontend http
  mode http
  bind :80
  http-request redirect scheme https code 301

frontend web
  mode http
  bind :443 ssl crt /etc/kraken/tls/kraken.pem alpn h2,http/1.1
  option httplog
  option forwardfor
  # REGLA: igual que en producción, el requestId siempre lo pone el borde (deploy/app/haproxy.cfg).
  unique-id-format %{+X}o\ %ci%cp%fi%fp%Ts%rt%pid
  http-request set-header X-Request-ID %[unique-id]
  http-request set-header X-Forwarded-Proto https
  log-format "%ci [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %{+Q}r id=%ID"
  default_backend app

backend app
  mode http
  option httpchk GET /api/health/ready
  http-check expect status 200
  server app 127.0.0.1:3000 check inter 5s

frontend pg
  mode tcp
  bind :5000
  default_backend pg_local

backend pg_local
  mode tcp
  server db 127.0.0.1:5432 maxconn 150
