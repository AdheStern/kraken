# deploy/dr/postgresql.conf
# PostgreSQL de la VM de recuperación (AGENTS.md §10 DR). Reemplaza al postgresql.conf de Patroni que trae la
# base restaurada (rutas del contenedor, réplicas, etcd). dr-restore.sh lo copia a /etc/kraken/dr/.
# REGLA: los parámetros que la recuperación exige iguales o mayores que en el primario copian db/patroni.yml.
data_directory = '/var/lib/kraken/pgdata'
hba_file = '/etc/kraken/dr/pg_hba.conf'
ident_file = '/etc/postgresql/16/main/pg_ident.conf'
# POR QUÉ: solo localhost; la app llega por el HAProxy del host (red del host), igual que en producción.
listen_addresses = 'localhost'
port = 5432
unix_socket_directories = '/var/run/postgresql'

wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_log_hints = on
max_connections = 200
shared_buffers = 2GB
effective_cache_size = 6GB
log_min_duration_statement = 1000
timezone = 'UTC'

# POR QUÉ: mientras dure el desastre, lo nuevo también va al repo2 (una línea de tiempo nueva de la misma stanza).
archive_mode = on
archive_command = 'pgbackrest --config=/etc/kraken/dr/pgbackrest.conf --stanza=kraken archive-push %p'
archive_timeout = 60
# Lo escribe dr-restore.sh: en un ensayo, archive_mode = off.
include_if_exists = '/etc/kraken/dr/modo.conf'
