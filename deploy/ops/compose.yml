# deploy/ops/compose.yml
# Operación en ops-01 (AGENTS.md §10 Observabilidad): métricas (Prometheus), logs (Loki), tableros (Grafana)
# y avisos de caída por correo y Teams (Uptime Kuma). Solo en la VLAN de operación; nada se publica afuera.
#   docker compose -f /opt/kraken/ops/compose.yml up -d

name: kraken-ops

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "3" }

services:
  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.4.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/lib/kraken-ops/prometheus:/prometheus
    ports: ["9090:9090"]

  loki:
    <<: *defaults
    image: grafana/loki:3.5.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - /var/lib/kraken-ops/loki:/loki
    ports: ["3100:3100"]

  grafana:
    <<: *defaults
    image: grafana/grafana:12.0.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - /var/lib/kraken-ops/grafana:/var/lib/grafana
      - /etc/kraken/grafana_admin:/run/secrets/grafana_admin:ro
    ports: ["3001:3000"]

  uptime-kuma:
    <<: *defaults
    image: louislam/uptime-kuma:1.23.16
    volumes:
      - /var/lib/kraken-ops/uptime-kuma:/app/data
    ports: ["3002:3001"]
