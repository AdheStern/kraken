# deploy/staging/compose.yml
# Staging en un solo nodo (lpzvmkrkstg01, 172.22.12.117; AGENTS.md §10): las mismas imágenes que producción (app,
# worker y migrate), PostgreSQL 18 propio sin puertos publicados, HAProxy solo para web con TLS y Mailpit en lugar
# de Graph. Con APP_ENV=staging los correos van a Mailpit y los adjuntos al volumen files (FILES_ROOT), nunca a
# Microsoft 365. Mismo nombre de proyecto que producción: deploy.sh usa /opt/kraken/compose.yml en los dos entornos.
# En el nodo: deploy.sh copia a /opt/kraken/ compose.yml, haproxy/ e initdb/ y escribe KRAKEN_TAG en
# /opt/kraken/.env; los secretos van en /etc/kraken/{app,migrate,postgres}.env (dueño root:deploy, permisos 640:
# docker compose los lee como deploy) y el certificado en /etc/kraken/tls/kraken.pem (root, 600).
#   docker compose -f /opt/kraken/compose.yml up -d
#   docker compose -f /opt/kraken/compose.yml --profile migrate run --rm migrate

name: kraken

x-image: &image-defaults
  restart: unless-stopped
  env_file: /etc/kraken/app.env
  # POR QUÉ: la app y el worker llegan a la base por la red de compose (postgres:5432), sin el :5000 de producción.
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # POSTGRES_PASSWORD (superusuario), KRAKEN_MIGRATOR_PASSWORD y KRAKEN_APP_PASSWORD: los lee initdb/ al crear la base.
    env_file: /etc/kraken/postgres.env
    volumes:
      # TRAMPA: desde la 18 la imagen guarda los datos en /var/lib/postgresql/18/docker; el volumen va en la carpeta
      # de arriba, nunca en .../data.
      - pgdata:/var/lib/postgresql
      # Solo corre con el volumen vacío: roles, base kraken y privilegios por defecto (= deploy/sql/roles.sql).
      - ./initdb:/docker-entrypoint-initdb.d:ro
    # POR QUÉ: por TCP; durante initdb el servidor temporal solo escucha en el socket y no debe darse por listo.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d kraken"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  app:
    <<: *image-defaults
    image: ${KRAKEN_REGISTRY:-ghcr.io/adhestern}/kraken-app:${KRAKEN_TAG:?define KRAKEN_TAG}
    ports:
      # Solo en la IP del nodo: la usa el HAProxy del host (y deploy.sh para esperar /api/health/ready).
      - "172.22.12.117:3000:3000"
    volumes:
      # FILES_ROOT=/var/lib/kraken/files en app.env; la carpeta existe en la imagen con dueño node (Dockerfile).
      - files:/var/lib/kraken/files

  worker:
    <<: *image-defaults
    image: ${KRAKEN_REGISTRY:-ghcr.io/adhestern}/kraken-worker:${KRAKEN_TAG:?define KRAKEN_TAG}
    stop_grace_period: 30s

  migrate:
    <<: *image-defaults
    image: ${KRAKEN_REGISTRY:-ghcr.io/adhestern}/kraken-worker:${KRAKEN_TAG:?define KRAKEN_TAG}
    restart: "no"
    profiles: [migrate]
    # REGLA: solo este servicio recibe la clave del dueño del esquema (DDL), como en producción (AGENTS.md §4).
    env_file: [/etc/kraken/app.env, /etc/kraken/migrate.env]
    command: ["pnpm", "migrate:deploy"]

  # Correo falso de staging: el worker envía por su API (MAILPIT_URL=http://mailpit:8025) y la interfaz web se ve solo
  # desde la red interna. LIMITACIÓN: sin autenticación ni persistencia; los mensajes se pierden al recrearlo.
  mailpit:
    image: axllent/mailpit:v1.27.0
    restart: unless-stopped
    ports:
      - "172.22.12.117:8025:8025"
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  haproxy:
    image: haproxy:3.0-alpine
    restart: unless-stopped
    network_mode: host
    # TRAMPA: con la red del host, el usuario de la imagen no puede abrir puertos < 1024; arranca como root, abre los
    # puertos y lee el certificado, y baja a haproxy (user/group en global de haproxy/haproxy.cfg).
    user: root
    volumes:
      # TRAMPA: se monta la carpeta, no el archivo: rsync reemplaza haproxy.cfg por un archivo nuevo (otro inodo) y con
      # el archivo montado la recarga seguiría leyendo el anterior. La carpeta tapa la errors/ de la imagen (sin uso).
      - ./haproxy:/usr/local/etc/haproxy:ro
      - /etc/kraken/tls/kraken.pem:/etc/kraken/tls/kraken.pem:ro

  # LIMITACIÓN: Loki aún no tiene destino; arranca solo con --profile logs. deploy.sh no copia alloy.river a staging:
  # al activarlo, copiar deploy/app/alloy.river a /opt/kraken/ con su URL de Loki.
  alloy:
    image: grafana/alloy:v1.9.1
    restart: unless-stopped
    profiles: [logs]
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy.river:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pgdata:
  files:
