# deploy/staging/haproxy.cfg
# HAProxy de staging (lpzvmkrkstg01, red del host; AGENTS.md §10): termina TLS para stg-kraken.dima.com.bo y
# manda todo al único Next.js. Sin frontend de base: la app llega a Postgres por la red de compose.
#   web   :443 → lpzvmkrkstg01 (172.22.12.117:3000), con /etc/kraken/tls/kraken.pem. :80 solo redirige.
#   stats :8404 → solo en 127.0.0.1, para revisar el estado desde el nodo.

global
  log stdout format raw local0 info
  user haproxy
  group haproxy
  maxconn 2000
  ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
  log global
  timeout connect 5s
  timeout client 60s
  timeout server 60s

frontend http
  mode http
  bind :80
  http-request redirect scheme https code 301

frontend web
  mode http
  bind :443 ssl crt /etc/kraken/tls/kraken.pem alpn h2,http/1.1
  option httplog
  option forwardfor
  # POR QUÉ: Next y Better Auth arman URLs y cookies seguras según el esquema que vio el cliente.
  http-request set-header X-Forwarded-Proto https
  # REGLA: igual que en producción, el requestId siempre lo pone el borde (deploy/app/haproxy.cfg).
  unique-id-format %{+X}o\ %ci%cp%fi%fp%Ts%rt%pid
  http-request set-header X-Request-ID %[unique-id]
  log-format "%ci [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %{+Q}r id=%ID"
  default_backend app

backend app
  mode http
  option httpchk GET /api/health/ready
  http-check expect status 200
  default-server inter 5s fall 3 rise 2
  # REGLA: el nombre es el de deploy/hosts/staging, como en producción.
  server lpzvmkrkstg01 172.22.12.117:3000 check

frontend stats
  mode http
  bind 127.0.0.1:8404
  stats enable
  stats uri /
  stats refresh 10s
