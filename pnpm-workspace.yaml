allowBuilds:
  '@prisma/engines': true
  cpu-features: false
  esbuild: true
  lefthook: true
  prisma: true
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: false
# POR QUÉ: correcciones de seguridad dentro de la misma versión mayor que sus dependientes (F6, pnpm audit).
# Riesgo aceptado, sin forzar la mayor: deepmerge-ts 7 (solo mezcla la configuración de Prisma) y uuid 8 de
# exceljs (usa v4; el aviso es de v3/v5/v6).
overrides:
  fast-uri: ">=3.1.9 <4"
  mysql2: ">=3.23.1 <4"
# REGLA: el CI falla con avisos altos de runtime; estos son los riesgos aceptados de arriba (y minimatch de exceljs,
# que solo lee patrones propios). Un aviso nuevo se corrige o se acepta aquí con su motivo.
auditConfig:
  ignoreGhsas:
    - GHSA-ggr8-5vv4-36mx
    - GHSA-w5hq-g745-h8pq
    - GHSA-g3hv-75wg-m249
